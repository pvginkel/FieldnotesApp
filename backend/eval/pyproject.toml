[project]
name = "fieldnotes-eval"
version = "0.1.0"
description = "Fieldnotes replay and eval harness: the match pipeline measured against labeled data."
requires-python = ">=3.13"
dependencies = [
    # The backend project: the API's domain (app.fieldnotes) and the app the replay drives.
    "fieldnotes",
    "fieldnotes-contracts",
    "httpx>=0.28",
    # The MCP client of `mcp_e2e.py`, pinned as the server is: mcp 2 changed its API.
    "mcp>=1.28,<2",
    "numpy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes_eval"]

[tool.uv.sources]
fieldnotes = { workspace = true }
fieldnotes-contracts = { workspace = true }
