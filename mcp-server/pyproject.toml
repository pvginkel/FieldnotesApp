[project]
name = "fieldnotes-mcp"
version = "0.1.0"
description = "Fieldnotes MCP server: the three agent tools, post, react and get, over the API."
requires-python = ">=3.13"
dependencies = [
    "fieldnotes-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes_mcp"]

[tool.uv.sources]
fieldnotes-contracts = { workspace = true }
