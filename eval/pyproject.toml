[project]
name = "fieldnotes-eval"
version = "0.1.0"
description = "Fieldnotes replay and eval harness: the match pipeline measured against labeled data."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fieldnotes-api",
    "fieldnotes-contracts",
    "httpx>=0.28",
    "numpy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes_eval"]

[tool.uv.sources]
fieldnotes-api = { workspace = true }
fieldnotes-contracts = { workspace = true }
