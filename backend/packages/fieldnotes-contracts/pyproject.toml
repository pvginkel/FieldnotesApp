[project]
name = "fieldnotes-contracts"
version = "0.1.0"
description = "Shared wire models of the Fieldnotes REST surface, for the API and the MCP server."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes_contracts"]
