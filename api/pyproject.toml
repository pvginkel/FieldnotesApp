[project]
name = "fieldnotes-api"
version = "0.1.0"
description = "Fieldnotes API: the git-backed store, its index and match pipeline, and the webhooks."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "fieldnotes-contracts",
    "httpx>=0.28",
    "numpy>=2",
    "pyyaml>=6",
    "uvicorn>=0.30",
]

[project.scripts]
fieldnotes-api = "fieldnotes_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes_api"]

[tool.uv.sources]
fieldnotes-contracts = { workspace = true }
