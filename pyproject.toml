# uv workspace root for FieldnotesApp, laid out like KubeCoder's. This project is not itself a
# package (`package = false`); it only coordinates the members below. The shared wire models live
# in `packages/fieldnotes-contracts` and reach the API and the MCP server as a workspace source.
[project]
name = "fieldnotes-workspace"
version = "0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "api", "mcp-server", "eval"]

[tool.uv.sources]
fieldnotes-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# importlib mode lets identically-named test modules coexist across the members' test dirs
# without __init__.py shims.
# -q --tb=short is the token-lean default for agent sessions: summary line on green, file:line
# tracebacks on red. Pass -v / --tb=long explicitly when more is needed.
addopts = "--import-mode=importlib -q --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "api", "mcp-server", "eval"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.isort]
known-first-party = [
    "fieldnotes_contracts",
    "fieldnotes_api",
    "fieldnotes_mcp",
    "fieldnotes_eval",
]

# Stated at defaults: `ruff format` runs the whole Python tree at ruff's own defaults under the
# line-length above, gated by `kc project lint`. `# fmt: off` / `# fmt: skip` is the escape hatch.
[tool.ruff.format]
